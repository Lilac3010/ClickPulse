# VM3 - copied to $SPARK_HOME/conf/spark-defaults.conf by install_configs.sh
spark.master                              spark://vm3:7077
spark.submit.deployMode                   client
spark.jars                                /opt/clickpulse/jars/iceberg-spark-runtime-3.5_2.12-1.6.1.jar
spark.sql.extensions                      org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.catalog.lake                    org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.lake.type               hadoop
spark.sql.catalog.lake.warehouse          hdfs://vm2:9000/clickpulse/warehouse
spark.sql.session.timeZone                UTC
spark.driver.extraJavaOptions             -Duser.timezone=UTC
spark.executor.extraJavaOptions           -Duser.timezone=UTC
spark.sql.sources.partitionOverwriteMode  dynamic
spark.sql.shuffle.partitions              8
spark.eventLog.enabled                    false
